<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Registrasi Mahasiswa</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>Form Registrasi Mahasiswa</h1>
    </header>

    <section id="form-registrasi" class="registration section">
      <div class="container">
        <h2>Registrasi Mahasiswa Baru</h2>
        <form
          action="/submit-registration"
          method="POST"
          class="registration-form"
        >
          <!-- Nama Lengkap -->
          <div class="form-group">
            <label for="nama">Nama Lengkap</label>
            <input
              type="text"
              id="nama"
              name="nama"
              placeholder="Masukkan nama lengkap Anda"
              required
            />
          </div>

          <!-- NIM -->
          <div class="form-group">
            <label for="nim">NIM</label>
            <input
              type="text"
              id="nim"
              name="nim"
              placeholder="Masukkan NIM Anda"
              pattern="[0-9]{8,10}"
              title="NIM harus berupa angka 8-10 digit"
              required
            />
          </div>

          <!-- Email -->
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Masukkan Email Anda"
              required
            />
          </div>

          <!-- Jenis Kelamin -->
          <div class="form-group">
            <label>Jenis Kelamin</label>
            <input
              type="radio"
              id="laki-laki"
              name="gender"
              value="Laki-laki"
              required
            />
            <label for="laki-laki">Laki-laki</label>
            <input
              type="radio"
              id="perempuan"
              name="gender"
              value="Perempuan"
              required
            />
            <label for="perempuan">Perempuan</label>
          </div>

          <!-- Program Studi -->
          <div class="form-group">
            <label for="prodi">Program Studi</label>
            <select id="prodi" name="prodi" required>
              <option value="">Pilih Program Studi</option>
              <option value="informatika">Informatika</option>
              <option value="sistem-informasi">Sistem Informasi</option>
              <option value="teknik-komputer">Teknik Komputer</option>
              <option value="teknik-elektro">Teknik Elektro</option>
            </select>
          </div>

          <!-- Hobi -->
          <div class="form-group">
            <label>Hobi</label>
            <input type="checkbox" id="hobi1" name="hobi" value="Olahraga" />
            <label for="hobi1">Olahraga</label>
            <input type="checkbox" id="hobi2" name="hobi" value="Membaca" />
            <label for="hobi2">Membaca</label>
            <input type="checkbox" id="hobi3" name="hobi" value="Menulis" />
            <label for="hobi3">Menulis</label>
          </div>

          <!-- Foto -->
          <div class="form-group">
            <label for="foto">Upload Foto</label>
            <input
              type="file"
              id="foto"
              name="foto"
              accept=".jpg,.png"
              required
            />
          </div>

          <!-- Submit -->
          <button type="submit" class="button button-primary">Daftar</button>
        </form>
      </div>
    </section>
  </body>
</html>
